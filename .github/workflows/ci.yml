name: Shell quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bash
        run: bash --version

      - name: Check Bash syntax and smoke tests
        run: make check

      - name: Run ShellCheck
        uses: step-security/action-shellcheck@v2
        with:
          scandir: .
          severity: error
